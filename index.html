<title>Hoja de Campo Digital</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cdde00">
<meta name="description" content="Hoja de campo digital de Fundació Trinijove para las caracterizaciones de residuos del expediente ARC-2027-6.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoja de campo">
<style>
/*
  Layout: single-column mobile app shell — sticky top bar, scrollable body,
  bottom tab bar. Views are swapped by toggling [hidden]; the "nueva
  caracterización" flow is a 4-step wizard inside one view.
*/
:root{
  --bg:#f5f6ef; --surface:#ffffff; --surface-2:#eef1e0;
  --fg:#1a1a1a; --fg-muted:#5b5f52; --border:#dfe3d2;
  --accent:#7a8f00; --accent-ink:#3a4400; --accent-bg:#eaf1b8;
  --ok:#2f8a3e; --ok-bg:#e3f3e2;
  --warn:#a15b00; --warn-bg:#fbeecb;
  --danger:#b3261e; --danger-bg:#fbe4e2;
  --shadow: 0 1px 2px rgba(20,20,10,.06), 0 6px 16px -8px rgba(20,20,10,.18);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c-other:#a7ab99;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14150f; --surface:#1d1f16; --surface-2:#262a1a;
    --fg:#eef0e4; --fg-muted:#a7ab99; --border:#33361f;
    --accent:#cdde00; --accent-ink:#eaf3a0; --accent-bg:#2c3300;
    --ok:#6fd47f; --ok-bg:#173322;
    --warn:#e3ad4e; --warn-bg:#3a2a08;
    --danger:#f2938c; --danger-bg:#3a1614;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.6);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c-other:#7a7d70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14150f; --surface:#1d1f16; --surface-2:#262a1a;
  --fg:#eef0e4; --fg-muted:#a7ab99; --border:#33361f;
  --accent:#cdde00; --accent-ink:#eaf3a0; --accent-bg:#2c3300;
  --ok:#6fd47f; --ok-bg:#173322;
  --warn:#e3ad4e; --warn-bg:#3a2a08;
  --danger:#f2938c; --danger-bg:#3a1614;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.6);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c-other:#7a7d70;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  height:100%; margin:0; display:flex; justify-content:center;
}
html{height:100%}
#shell{
  width:100%; max-width:460px; min-height:100%;
  display:flex; flex-direction:column; background:var(--bg);
  position:relative;
}
h1,h2,h3{font-family:"Manrope",-apple-system,sans-serif; text-wrap:balance; margin:0}
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 18px; display:flex; align-items:center; gap:10px;
}
.topbar .mark{
  height:28px;width:auto;flex:none;display:flex;align-items:center;
  padding:3px 6px;border-radius:7px;background:#ffffff;
}
.topbar .mark img{height:100%;width:auto;display:block}
.topbar .titles{display:flex; flex-direction:column; min-width:0}
.topbar .titles b{font-size:14px}
.topbar .titles span{font-size:11.5px;color:var(--fg-muted)}

main{flex:1; padding:16px 18px 90px; display:flex; flex-direction:column; gap:16px; min-width:0}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:16px; box-shadow:var(--shadow);
}
.card + .card{margin-top:0}
.section-label{
  font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-muted); font-weight:700;
}

/* home / dashboard */
.stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.stat{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:12px 10px; text-align:center; box-shadow:var(--shadow);
}
.stat b{display:block; font-size:22px; font-variant-numeric:tabular-nums}
.stat span{font-size:10.5px; color:var(--fg-muted)}

.list{display:flex; flex-direction:column; gap:8px}
.rowcard{
  display:flex; align-items:center; gap:10px; padding:11px 12px;
  border:1px solid var(--border); border-radius:12px; background:var(--surface);
}
.rowcard .ricon{
  width:34px;height:34px;border-radius:9px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent-ink);
}
.rowcard .rmain{min-width:0; flex:1}
.rowcard .rmain b{font-size:13.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rowcard .rmain span{font-size:11.5px; color:var(--fg-muted)}
.pill{
  font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:99px; white-space:nowrap;
}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.warn{background:var(--warn-bg); color:var(--warn)}
.pill.pending{background:var(--accent-bg); color:var(--accent-ink)}

.btn{
  appearance:none; border:none; border-radius:12px; padding:13px 16px;
  font-size:14.5px; font-weight:700; font-family:inherit; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
  transition:transform .08s ease;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent); color:#1c2100}
.btn.ghost{background:var(--surface-2); color:var(--fg)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.small{padding:8px 12px; font-size:12.5px; border-radius:9px}

.fab{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(78px + env(safe-area-inset-bottom,0px));
  width:min(424px, calc(100% - 36px));
  z-index:6;
}

.tabbar{
  position:fixed; left:50%; transform:translateX(-50%); bottom:0;
  width:100%; max-width:460px;
  background:var(--surface); border-top:1px solid var(--border);
  padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
  display:flex; z-index:5;
}
.tabbar button{
  flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--fg-muted); font-size:10.5px; font-family:inherit; padding:6px 4px; cursor:pointer;
}
.tabbar button svg{width:19px;height:19px}
.tabbar button.active{color:var(--accent-ink)}
:root[data-theme="dark"] .tabbar button.active, @media (prefers-color-scheme:dark){}
.tabbar button.active svg{stroke:var(--accent)}

/* wizard */
.steps{display:flex; gap:6px; margin-bottom:2px}
.steps i{flex:1; height:4px; border-radius:99px; background:var(--border)}
.steps i.done{background:var(--accent)}
.steps i.now{background:var(--accent); opacity:.55}

label.field{display:flex; flex-direction:column; gap:6px; font-size:12.5px; color:var(--fg-muted); font-weight:600}
label.field input, label.field select, label.field textarea{
  font-family:inherit; font-size:14.5px; color:var(--fg); background:var(--surface-2);
  border:1px solid var(--border); border-radius:10px; padding:11px 12px; width:100%;
}
label.field textarea{resize:vertical; min-height:64px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.field-row{display:flex; flex-direction:column; gap:12px}

.chiprow{display:flex; gap:8px; flex-wrap:wrap}
.chip{
  border:1px solid var(--border); background:var(--surface-2); color:var(--fg);
  font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:99px; cursor:pointer;
}
.chip.sel{background:var(--accent); border-color:var(--accent); color:#1c2100}

.tolerance{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  font-size:12.5px; font-weight:600;
}
.tolerance.ok{background:var(--ok-bg); color:var(--ok)}
.tolerance.warn{background:var(--danger-bg); color:var(--danger)}

.checklist{display:flex; flex-direction:column; gap:9px}
.checkitem{display:flex; align-items:flex-start; gap:10px; font-size:13px}
.checkitem .box{
  width:19px;height:19px;border-radius:6px;border:1.6px solid var(--border); flex:none; margin-top:1px;
  display:flex; align-items:center; justify-content:center; background:var(--surface-2);
}
.checkitem.done .box{background:var(--ok); border-color:var(--ok)}
.checkitem.done .box svg{stroke:#fff}
.checkitem b{display:block}
.checkitem span{color:var(--fg-muted); font-size:11.5px}

.photogrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.pshot{
  aspect-ratio:1; border-radius:10px; border:1.5px dashed var(--border);
  display:flex; align-items:center; justify-content:center; color:var(--fg-muted);
  background:var(--surface-2); overflow:hidden; position:relative; font-size:10px; text-align:center; padding:4px;
}
.pshot img{width:100%; height:100%; object-fit:cover}
.pshot.filled{border-style:solid; border-color:var(--ok)}
.pshot .badge{
  position:absolute; top:4px; right:4px; background:var(--ok); color:#fff; border-radius:50%;
  width:16px;height:16px; display:flex; align-items:center; justify-content:center;
}
.pshot .badge svg{width:10px;height:10px; stroke:#fff}

.geobox{
  display:flex; align-items:center; gap:10px; padding:11px 12px; border-radius:10px;
  background:var(--surface-2); border:1px solid var(--border); font-size:12.5px;
}
.geobox svg{flex:none; color:var(--accent-ink)}
.geobox b{font-size:12.5px}
.geobox span{color:var(--fg-muted); display:block; font-size:11px}

.summary-row{display:flex; justify-content:space-between; gap:10px; font-size:13px; padding:8px 0; border-bottom:1px solid var(--border)}
.summary-row:last-child{border-bottom:none}
.summary-row span:first-child{color:var(--fg-muted)}
.summary-row span:last-child{font-weight:700; text-align:right}

.banner{
  display:flex; gap:10px; align-items:flex-start; padding:12px 13px; border-radius:12px; font-size:12.5px;
  background:var(--accent-bg); color:var(--accent-ink); border:1px solid var(--border);
}
.banner svg{flex:none; margin-top:1px}

.empty{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px;
  padding:36px 18px; color:var(--fg-muted);
}

.toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(12px);
  background:var(--fg); color:var(--bg); font-size:12.5px; font-weight:600; padding:10px 16px; border-radius:99px;
  opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease; z-index:9; white-space:nowrap;
  box-shadow:var(--shadow);
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

a{color:var(--accent-ink)}
.hdr-actions{display:flex; align-items:center; gap:10px}
.iconbtn{
  background:var(--surface-2); border:1px solid var(--border); border-radius:9px; width:34px; height:34px;
  display:flex; align-items:center; justify-content:center; color:var(--fg); cursor:pointer;
}

/* fracción / incidencia photo slots */
.fslot{
  aspect-ratio:1; border-radius:10px; border:1.5px dashed var(--border);
  display:flex; align-items:center; justify-content:center; color:var(--fg-muted);
  background:var(--surface-2); overflow:hidden; position:relative; font-size:10px; text-align:center; padding:4px; cursor:pointer;
}
.fslot img{width:100%; height:100%; object-fit:cover}
.fslot.filled{border-style:solid; border-color:var(--ok)}
.fslot .rm{
  position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%;
  background:rgba(20,20,10,.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; line-height:1;
}
.inc-item{
  display:flex; gap:10px; padding:10px; border:1px solid var(--border); border-radius:12px; background:var(--surface-2);
}
.inc-item .ithumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--surface)}
.inc-item .itext{flex:1; font-size:12.5px; min-width:0}
.inc-item .idel{flex:none; background:none; border:none; color:var(--danger); font-size:12px; font-weight:700; cursor:pointer; padding:2px 4px}
.photo-report-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.photo-report-grid figure{margin:0; display:flex; flex-direction:column; gap:5px}
.photo-report-grid img{width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:10px; border:1px solid var(--border); background:var(--surface-2)}
.photo-report-grid figcaption{font-size:11px; color:var(--fg-muted)}

.fraccam{flex:none; width:44px; display:flex; align-items:center; justify-content:center; background:none; border:none; border-left:1px solid var(--border); cursor:pointer; color:var(--fg-muted)}
.fraccam.has{color:var(--ok)}
.fracphoto-preview{display:flex; align-items:center; gap:8px; padding:2px 15px 12px}
.fracphoto-preview img{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--border)}
.fracphoto-preview span{font-size:11px; color:var(--fg-muted); flex:1}
.fracphoto-preview button{background:none;border:none;color:var(--danger);font-size:11.5px;font-weight:700;cursor:pointer;padding:2px 4px}

.chart-legend{display:flex; flex-direction:column; gap:7px}
.chart-legend .lrow{display:flex; align-items:center; gap:8px; font-size:12.5px}
.chart-legend .ldot{width:10px;height:10px;border-radius:3px;flex:none}
.chart-legend .llabel{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.chart-legend .lval{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}

@media print{
  .topbar, .tabbar, .no-print{display:none !important}
  body{display:block}
  #shell{max-width:none; width:100%}
  main{padding:0; gap:14px}
  .card{box-shadow:none; break-inside:avoid}
}
</style>

    window.supabase.createClient(window.HCD_CONFIG.supabaseUrl, window.HCD_CONFIG.supabaseKey) : null;
  var STORE_KEY = SB ? "trinijove_hcd_v2" : "trinijove_hcd_v1";
  var state = load();
  if(!state.tecnicos || !state.tecnicos.length) state.tecnicos = TECNICOS.slice();
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    // Sin conexión a Supabase (config.js vacío) se sigue mostrando la demo con datos de ejemplo.
    return {records: SB ? [] : SEED, draft:null, tecnicos: TECNICOS.slice()};

  function save(){

    scheduleSync();

  /* ---------- sincronización con Supabase ---------- */
  // El móvil guarda primero en localStorage y después sube a Supabase: así se puede
  // trabajar sin cobertura. state.pending lista los registros aún no subidos; al subir
  // uno, sus fotos (data: URLs) pasan a Storage y en el registro queda solo el enlace.
  var syncing = false, syncTimer = null, syncError = "";
  if(!state.pending) state.pending = [];

  function markDirty(id){ if(state.pending.indexOf(id)<0) state.pending.push(id); }
  function scheduleSync(){
    if(!SB || !session) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(syncNow, 400);
  }
  function syncLabel(){
    if(!SB) return "";
    if(syncing) return "Sincronizando…";
    if(state.pending.length) return state.pending.length+" registro(s) pendiente(s) de subir"+(navigator.onLine===false?" (sin conexión)":"");
    if(syncError) return "No se pudo sincronizar: "+syncError;
    return "Todo sincronizado";
  }
  function paintSync(){
    var el = document.getElementById("syncState");
    if(el) el.textContent = syncLabel();
  }

  function uploadPhoto(recId, key, value){
    if(typeof value!=="string" || value.indexOf("data:")!==0) return Promise.resolve(value);
    var path = session.user.id+"/"+recId+"/"+key+"-"+Math.random().toString(36).slice(2,10)+".jpg";
    return fetch(value).then(function(r){ return r.blob(); }).then(function(blob){
      return SB.storage.from("fotos").upload(path, blob, {contentType: blob.type || "image/jpeg", upsert:false});
    }).then(function(res){
      if(res.error) throw res.error;
      return SB.storage.from("fotos").getPublicUrl(path).data.publicUrl;
    });
  }
  function uploadRecordPhotos(rec){
    var jobs = [];
    ["photos","fotosMateriales"].forEach(function(field){
      var obj = rec[field]; if(!obj) return;
      Object.keys(obj).forEach(function(k){
        jobs.push(uploadPhoto(rec.id, field+"-"+k, obj[k]).then(function(url){ obj[k] = url; }));
      });
    });
    (rec.incidencias||[]).forEach(function(inc, i){
      jobs.push(uploadPhoto(rec.id, "incidencia-"+i, inc.foto).then(function(url){ inc.foto = url; }));
    });
    return Promise.all(jobs);
  }
  function pushOne(id){
    var rec = state.records.filter(function(r){ return r.id===id; })[0];
    if(!rec) return Promise.resolve();
    return uploadRecordPhotos(rec).then(function(){
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
      return SB.from("registros").upsert({id: rec.id, data: rec});
    }).then(function(res){
      if(res.error) throw res.error;
      state.pending = state.pending.filter(function(x){ return x!==id; });
    });
  }
  function pull(){
    return SB.from("registros").select("id,data").order("creado", {ascending:false}).then(function(res){
      if(res.error) throw res.error;
      var server = res.data.map(function(row){ return row.data; });
      var ids = {}; server.forEach(function(r){ ids[r.id]=true; });
      // Lo que aún no se ha subido gana a la copia del servidor.
      var local = state.records.filter(function(r){ return state.pending.indexOf(r.id)>-1; });
      local.forEach(function(r){ ids[r.id]=false; });
      state.records = local.concat(server.filter(function(r){ return ids[r.id]; }));
    });
  }
  function syncNow(){
    if(!SB || !session || syncing) return;
    if(navigator.onLine===false){ paintSync(); return; }
    syncing = true; paintSync();
    var chain = Promise.resolve();
    state.pending.slice().forEach(function(id){ chain = chain.then(function(){ return pushOne(id); }); });
    chain.then(pull).then(function(){
      syncError = "";
    }).catch(function(e){
      syncError = (e && e.message) || "error de conexión";
    }).then(function(){
      syncing = false;
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
      if(!wizard) render(); else paintSync();
    });
  }
  window.addEventListener("online", syncNow);
  setInterval(syncNow, 60000);

  // Borrado (solo administrador): primero en Supabase, después en el móvil. Requiere conexión.
  function photoPaths(rec){
    var urls = [];
    ["photos","fotosMateriales"].forEach(function(f){ if(rec[f]) Object.keys(rec[f]).forEach(function(k){ urls.push(rec[f][k]); }); });
    (rec.incidencias||[]).forEach(function(i){ urls.push(i.foto); });
    var marker = "/object/public/fotos/";
    return urls.filter(function(u){ return typeof u==="string" && u.indexOf(marker)>-1; })
      .map(function(u){ return decodeURIComponent(u.split(marker)[1]); });
  }
  function deleteRecord(rec, btn){
    if(!confirm("¿Eliminar este registro y sus fotos? No se puede deshacer.")) return;
    var removeLocal = function(){
      state.records = state.records.filter(function(r){ return r.id!==rec.id; });
      state.pending = state.pending.filter(function(x){ return x!==rec.id; });
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
      toast("Registro eliminado");
      goto(current==="new"?"home":current);
    };
    if(navigator.onLine===false){ toast("Necesitas conexión para eliminar"); return; }
    btn.disabled = true; btn.textContent = "Eliminando…";
    SB.from("registros").delete().eq("id", rec.id).select("id").then(function(res){
      if(res.error) throw res.error;
      // 0 filas: o no estaba subido todavía, o no hay permiso para borrarlo.
      if(!res.data.length && state.pending.indexOf(rec.id)<0) throw new Error("sin permiso");
      var paths = photoPaths(rec);
      return paths.length ? SB.storage.from("fotos").remove(paths) : null;
    }).then(removeLocal).catch(function(e){
      btn.disabled = false; btn.textContent = "Eliminar registro";
      toast("No se pudo eliminar: "+((e && e.message) || "error"));
    });
  }

  /* ---------- sesión ---------- */
  var session = null, perfil = null, authReady = !SB, loginBusy = false, loginMsg = "";
  function loadPerfil(){
    return SB.from("perfiles").select("nombre,es_admin").eq("user_id", session.user.id).maybeSingle().then(function(res){

  function onSession(s){
    var changed = (s && s.user.id) !== (session && session.user.id);
    // Otro usuario en el mismo móvil: no se mezclan los registros guardados.
    if(s && state.owner && state.owner!==s.user.id){
      state = {records:[], pending:[], draft:null, tecnicos: TECNICOS.slice()};
    }
    session = s;
    if(s) state.owner = s.user.id;
    authReady = true;
    if(!s){ perfil = null; render(); return; }
    if(!changed) return;
    loadPerfil().catch(function(){}).then(function(){ render(); syncNow(); });

  function toast(msg){

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function typeLabel(id){var t=TYPES.filter(function(x){return x.id===id})[0]; return t?t.label:id}
  // limpia un campo numérico a "solo dígitos con un separador decimal", sin tocar el
  // cursor — se usa en vez de type="number" porque ese tipo no soporta selectionStart
  // en varios navegadores, lo que rompía el cursor y hacía que las cifras se escribieran al revés.
  function sanitizeDecimal(v){
    v = String(v).replace(",", ".").replace(/[^0-9.]/g,"");
    var firstDot = v.indexOf(".");
    if(firstDot!==-1) v = v.slice(0,firstDot+1) + v.slice(firstDot+1).replace(/\./g,"");
    return v;
  }
  function refocusEnd(id){
    var el = document.getElementById(id) || main.querySelector('[data-mat="'+id+'"]') ;

  /* ---------- camera capture (shared by the materials step and the photos step) ---------- */
  // Las fotos de cámara (móvil) pueden pesar varios MB sin comprimir: con varias fotos por
  // registro, el informe generado se vuelve demasiado pesado para descargarse con fiabilidad
  // en el navegador (sobre todo en móvil). Se redimensionan y recomprimen aquí, en el único
  // punto compartido por todas las capturas, antes de guardarlas en el registro.
  var PHOTO_MAX_DIM = 1280;
  var PHOTO_QUALITY = 0.72;
  function compressPhoto(dataUrl, onDone){
    var img = new Image();
    img.onload = function(){
      var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if(!w || !h){ onDone(dataUrl); return; }
      var scale = Math.min(1, PHOTO_MAX_DIM / Math.max(w, h));
      var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
      try{
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        var out = canvas.toDataURL("image/jpeg", PHOTO_QUALITY);
        onDone(out && out.length < dataUrl.length ? out : dataUrl);
      }catch(e){ onDone(dataUrl); }
    };
    img.onerror = function(){ onDone(dataUrl); };
    img.src = dataUrl;
  }
  function readAsPhoto(file, onDone){
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){ compressPhoto(reader.result, onDone); };
    reader.readAsDataURL(file);
  }
  function pickPhoto(onDone){
    var fileInput = document.getElementById("fileInput");
    if(!fileInput) return;
    fileInput.value = "";
    fileInput.onchange = function(){
      var f = fileInput.files && fileInput.files[0];
      if(f) readAsPhoto(f, onDone);
    };
    fileInput.click();
  }

    document.getElementById("backBtn").addEventListener("click", function(){ goto(current==="new"?"home":current) });
    document.getElementById("reportBtn").addEventListener("click", function(){ renderReport(r.id); });
  }

  function photosCard(r){
    var fixed = [
      {key:"bascula", label:"Tique de báscula"},
      {key:"escalimetro", label:"Escalímetro 50 cm"},
      {key:"cartel", label:"Cartel del circuito"}
    ].filter(function(s){ return r.photos && r.photos[s.key]; });
    var matPhotoIds = r.fotosMateriales ? Object.keys(r.fotosMateriales).filter(function(k){ return r.fotosMateriales[k]; }) : [];

    var figs = fixed.map(function(s){

      return '<figure><img src="'+r.fotosMateriales[matId]+'" alt=""><figcaption>'+esc(materialLabel(r.tipo,matId))+'</figcaption></figure>';

      '<div class="photo-report-grid">'+figs.join("")+'</div></div>';

  function incidenciasCard(r){
    var incs = r.incidencias || [];
    if(!incs.length) return "";
    var rows = incs.map(function(i){
      return '<div class="inc-item">'+

  }

  function materialsCard(r){
    var mats = r.materials || {};
    var entries = Object.keys(mats).filter(function(k){ return parseFloat(mats[k])>0; })
      .map(function(k){ return {label: materialLabel(r.tipo,k), kg: parseFloat(mats[k])}; })
      .sort(function(a,b){ return b.kg-a.kg; });
    if(!entries.length) return "";
    var total = entries.reduce(function(s,e){ return s+e.kg; },0);
    var rows = entries.map(function(e){
      return '<div class="summary-row"><span>'+e.label+'</span><span>'+round1(e.kg)+' kg</span></div>';
    }).join("");
    return '<div class="card"><div class="section-label" style="margin-bottom:10px">Composición de materiales ('+round1(total)+' kg)</div>'+rows+'</div>';
  }

  /* ---------- INFORME (generado a partir de un registro) ---------- */
  function renderReport(id){
    var r = state.records.filter(function(x){return x.id===id})[0];
    if(!r) return;
    setTop("Informe de caracterización", r.circuito+" · Lote "+r.lote);

    var mats = r.materials || {};
    var matEntries = Object.keys(mats).filter(function(k){ return parseFloat(mats[k])>0; })
      .map(function(k){ return {label: materialLabel(r.tipo,k), kg: parseFloat(mats[k])}; })
      .sort(function(a,b){ return b.kg-a.kg; });
    var matTotal = matEntries.reduce(function(s,e){ return s+e.kg; },0);
    var matChart = donutChartHTML(matEntries, matTotal);

    var fixedShots = [
      {key:"bascula", label:"Tique de báscula"},
      {key:"escalimetro", label:"Escalímetro 50 cm"},
      {key:"cartel", label:"Cartel del circuito"}
    ].filter(function(s){ return r.photos && r.photos[s.key]; });
    var matPhotoIds = r.fotosMateriales ? Object.keys(r.fotosMateriales).filter(function(k){ return r.fotosMateriales[k]; }) : [];
    var figs = fixedShots.map(function(s){
      return '<figure><img src="'+r.photos[s.key]+'" alt=""><figcaption>'+s.label+'</figcaption></figure>';
    }).concat(matPhotoIds.map(function(matId){
      return '<figure><img src="'+r.fotosMateriales[matId]+'" alt=""><figcaption>'+esc(materialLabel(r.tipo,matId))+'</figcaption></figure>';
    }));

    var incs = r.incidencias || [];
    var incBlock = incs.length ? incs.map(function(i){
      return '<div class="inc-item">'+
        (i.foto? '<img class="ithumb" src="'+i.foto+'" alt="">' : '')+
        '<div class="itext">'+esc(i.texto)+'</div>'+
      '</div>';
    }).join("") : '<div style="font-size:12.5px;color:var(--fg-muted)">Sin incidencias registradas.</div>';

    var reportTitle = "Informe " + typeLabel(r.tipo) + " · Lote " + r.lote + " · " + r.fecha;
    var reportCards =
      '<div class="card">'+
        '<div class="section-label" style="margin-bottom:2px">Informe de caracterización</div>'+
        '<h2 style="font-size:18px; margin:4px 0 12px">'+typeLabel(r.tipo)+' · Lote '+r.lote+'</h2>'+
        '<div class="summary-row"><span>Expediente</span><span>ARC-2027-6</span></div>'+
        '<div class="summary-row"><span>Entidad</span><span>Fundació Privada Trinijove</span></div>'+
        '<div class="summary-row"><span>Circuito</span><span>'+esc(r.circuito)+'</span></div>'+
        '<div class="summary-row"><span>Instalación</span><span>'+esc(r.instalacion)+'</span></div>'+
        '<div class="summary-row"><span>Técnico/a</span><span>'+esc(r.tecnico)+'</span></div>'+
        '<div class="summary-row"><span>Fecha</span><span>'+r.fecha+'</span></div>'+
        (r.peso? '<div class="summary-row"><span>Peso de muestra</span><span>'+r.peso+' kg</span></div>' : '')+
      '</div>'+
      '<div class="card">'+
        '<div class="section-label" style="margin-bottom:10px">Composición de materiales'+(matTotal? ' ('+round1(matTotal)+' kg)':'')+'</div>'+
        (matChart || '<div style="font-size:12.5px;color:var(--fg-muted)">Sin desglose de materiales registrado.</div>')+
      '</div>'+
      (figs.length? '<div class="card"><div class="section-label" style="margin-bottom:10px">Evidencias fotográficas ('+figs.length+')</div><div class="photo-report-grid">'+figs.join("")+'</div></div>' : '')+
      '<div class="card">'+
        '<div class="section-label" style="margin-bottom:10px">Incidencias ('+incs.length+')</div>'+
        '<div style="display:flex;flex-direction:column;gap:8px">'+incBlock+'</div>'+
      '</div>'+
      '<div style="font-size:10.5px; color:var(--fg-muted); text-align:center; padding:4px 0 10px">Informe generado automáticamente por la Hoja de campo digital — Fundació Privada Trinijove</div>';

    main.innerHTML =
      '<div class="no-print" style="display:flex; flex-direction:column; gap:10px">'+
        '<button class="btn ghost" id="backBtn" style="align-self:flex-start">&larr; Volver</button>'+
        '<button class="btn primary block" id="pdfBtn">'+
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6z"/><path d="M9 13h6M9 17h6"/></svg>'+
          'Descargar informe (PDF)'+
        '</button>'+
        '<div style="font-size:11.5px; color:var(--fg-muted); text-align:center">Se descarga como página web; al abrirla aparece automáticamente el diálogo de impresión para guardarla como PDF.</div>'+
      '</div>'+
      reportCards;

    document.getElementById("backBtn").addEventListener("click", function(){ openRecord(id); });
    document.getElementById("pdfBtn").addEventListener("click", function(){
      var pdfBtn = document.getElementById("pdfBtn");
      pdfBtn.disabled = true;
      toast("Generando informe…");
      // watchdog: si por lo que sea nunca llega la respuesta (móvil lento, capability
      // que no contesta…), no dejamos el botón bloqueado ni al usuario sin ninguna señal
      var settled = false;
      var watchdog = setTimeout(function(){
        if(settled) return; settled = true;
        pdfBtn.disabled = false;
        toast("No se pudo generar el informe (tardó demasiado). Inténtalo de nuevo.");
      }, 12000);
      function finish(fn){ if(settled) return; settled = true; clearTimeout(watchdog); fn(); }
      try{
        var filenameBase = "informe_"+r.tipo+"_lote"+r.lote+"_"+r.fecha;
        var html = standaloneReportHTML(reportTitle, reportCards);
        downloadFile(filenameBase+".html", html, function(res){
          finish(function(){
            pdfBtn.disabled = false;
            if(res.ok){ toast("Informe descargado — ábrelo para guardarlo como PDF"); return; }
            if(res.reason==="declined") return;
            toast("No se pudo descargar el informe (motivo: "+(res.reason||"desconocido")+"). Abre el enlace del artefacto directamente en el navegador.");
          });
        });
      }catch(e){
        finish(function(){
          pdfBtn.disabled = false;
          toast("No se pudo generar el informe: "+(e && e.message ? e.message : "error desconocido"));
        });
      }
    });
  }

  /* ---------- WIZARD (nueva caracterización) ---------- */
  function startWizard(){
    wizard = {
      step:1,
      lote:null, tipo:null, instalacion:null, circuito:"", tecnico:state.tecnicos[0],
      peso:"", materials:{}, materialsOpen:{}, photos:{bascula:null, escalimetro:null, cartel:null},
      fotosMateriales:{}, incidencias:[], incNueva:null,
      tecManage:false, tecNuevo:"",
      geo:null
    };
    current="new";
    tabs.forEach(function(b){ b.classList.toggle("active", b.dataset.tab==="new"); });
    render();
  }

  var WIZARD_STEPS = ["Datos","Peso","Materiales","Fotos","Revisión"];

  function renderWizard(){
    if(!wizard) wizard = {step:1, lote:null, tipo:null, instalacion:null, circuito:"", tecnico:state.tecnicos[0], peso:"", materials:{}, materialsOpen:{0:true}, photos:{bascula:null,escalimetro:null,cartel:null}, fotosMateriales:{}, incidencias:[], incNueva:null, tecManage:false, tecNuevo:"", geo:null};
    setTop("Nueva caracterización", WIZARD_STEPS[wizard.step-1]+" · paso "+wizard.step+" de 5");

    var stepsHtml = '<div class="steps">'+[1,2,3,4,5].map(function(n){
      var cls = n<wizard.step?"done":(n===wizard.step?"now":"");
      return '<i class="'+cls+'"></i>';
    }).join("")+'</div>'+
    '<div style="display:flex; justify-content:space-between; margin-top:-6px">'+
      WIZARD_STEPS.map(function(s,i){
        var n=i+1, active = n===wizard.step;
        return '<span style="font-size:10px; font-weight:700; letter-spacing:.02em; color:'+(active?"var(--accent-ink)":"var(--fg-muted)")+'">'+s+'</span>';
      }).join("")+
    '</div>';

    var body = "";
    if(wizard.step===1) body = stepBasics();
    else if(wizard.step===2) body = stepWeight();
    else if(wizard.step===3) body = stepMaterials();
    else if(wizard.step===4) body = stepPhotos();
    else body = stepReview();

    main.innerHTML = stepsHtml + body;
    wireStep();
  }

  function stepBasics(){
    var loteChips = [1,2].map(function(l){
      return '<button type="button" class="chip '+(wizard.lote===l?"sel":"")+'" data-lote="'+l+'">Lote '+l+'</button>';
    }).join("");
    var tipos = TYPES.filter(function(t){ return !wizard.lote || t.lote.indexOf(wizard.lote)>-1; });
    var tipoChips = tipos.map(function(t){
      return '<button type="button" class="chip '+(wizard.tipo===t.id?"sel":"")+'" data-tipo="'+t.id+'">'+t.label+'</button>';
    }).join("");
    var insts = wizard.lote? INSTALACIONES[wizard.lote] : [];
    var instOptions = insts.map(function(i){ return '<option '+(wizard.instalacion===i?"selected":"")+'>'+esc(i)+'</option>' }).join("");

    var tecChips = state.tecnicos.map(function(t){
      return '<button type="button" class="chip '+(wizard.tecnico===t?"sel":"")+'" data-tec="'+esc(t)+'">'+esc(t)+'</button>';
    }).join("");
    var tecManageRows = state.tecnicos.map(function(t){
      return '<div class="inc-item" style="align-items:center; padding:8px 10px">'+
        '<div class="itext">'+esc(t)+'</div>'+
        '<button type="button" class="idel" data-tecdel="'+esc(t)+'">Quitar</button>'+
      '</div>';
    }).join("");
    var tecSection = '<div>'+
      '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px">'+
        '<div class="section-label">Técnico/a</div>'+
        '<button type="button" class="btn ghost small" id="tecManageBtn">'+(wizard.tecManage?"Cerrar":"Editar técnicos")+'</button>'+
      '</div>'+
      '<div class="chiprow">'+(tecChips||'<span style="font-size:12.5px;color:var(--fg-muted)">Añade un técnico/a</span>')+'</div>'+
      (wizard.tecManage?
        '<div style="display:flex;flex-direction:column;gap:8px; margin-top:10px">'+
          tecManageRows+
          '<div style="display:flex; gap:8px">'+
            '<input id="tecNuevo" type="text" placeholder="Nombre del nuevo técnico/a" style="flex:1; font-family:inherit; font-size:13px; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--fg)">'+
            '<button type="button" class="btn primary small" id="tecAddBtn">Añadir</button>'+
          '</div>'+
        '</div>' : '')+
    '</div>';

    return '<div class="card field-row">'+
      '<div>'+
        '<div class="section-label" style="margin-bottom:8px">Lote</div>'+
        '<div class="chiprow">'+loteChips+'</div>'+
      '</div>'+
      '<div>'+
        '<div class="section-label" style="margin-bottom:8px">Tipo de caracterización</div>'+
        '<div class="chiprow" id="tipoChips">'+(tipoChips||'<span style="font-size:12.5px;color:var(--fg-muted)">Selecciona primero un lote</span>')+'</div>'+
      '</div>'+
      '<label class="field">Instalación<select id="fInstalacion" '+(wizard.lote?"":"disabled")+'><option value="">Selecciona…</option>'+instOptions+'</select></label>'+
      '<label class="field">Circuito<input id="fCircuito" type="text" placeholder="p. ej. BCN-014" value="'+esc(wizard.circuito)+'"></label>'+
      tecSection+
    '</div>'+
    '<button class="btn primary block" id="nextBtn">Continuar</button>';
  }

  function stepWeight(){
    var t = TYPES.filter(function(x){return x.id===wizard.tipo})[0];
    var showTol = t && t.tol;
    var tolHtml = "";
    if(showTol){
      var v = parseFloat(wizard.peso);
      if(!isNaN(v)){
        var lo = t.tol.target*(1-t.tol.pct), hi = t.tol.target*(1+t.tol.pct);
        var ok = v>=Math.max(lo, t.tol.min) && v<=hi;
        tolHtml = '<div class="tolerance '+(ok?"ok":"warn")+'">'+
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(ok?'<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>':'<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>')+'</svg>'+
          (ok? 'Dentro de tolerancia (250 kg ±10%, mín. 225 kg)' : 'Fuera de tolerancia del protocolo — revisa la muestra')+
        '</div>';
      } else {
        tolHtml = '<div style="font-size:11.5px;color:var(--fg-muted)">Tolerancia del protocolo: 250 kg ±10% (mínimo 225 kg)</div>';
      }
    }
    return '<div class="card field-row">'+
      '<label class="field">Peso de la muestra (kg)<input id="fPeso" inputmode="decimal" type="text" autocomplete="off" placeholder="Ej. 248" value="'+esc(wizard.peso)+'"></label>'+
      tolHtml+
      '<label class="field">Observaciones de campo (opcional)<textarea id="fObs" placeholder="Incidencias, condiciones meteorológicas, etc."></textarea></label>'+
    '</div>'+
    '<div class="btn-row" style="display:flex; gap:10px">'+
      '<button class="btn ghost" id="backBtn" style="flex:1">Atrás</button>'+
      '<button class="btn primary" id="nextBtn" style="flex:2">Continuar</button>'+
    '</div>';
  }

  function stepMaterials(){
    var groups = materialsFor(wizard.tipo);
    var total = Object.keys(wizard.materials).reduce(function(s,k){ return s + (parseFloat(wizard.materials[k])||0); }, 0);
    var target = parseFloat(wizard.peso) || 0;
    var diff = target - total;
    var closeEnough = target>0 && Math.abs(diff) <= Math.max(0.5, target*0.02);
    var q = (wizard.materialsFilter||"").trim().toLowerCase();

    var groupsHtml = groups.map(function(g, gi){
      var items = g.items;
      var groupMatches = !q || g.group.toLowerCase().indexOf(q)>-1;
      if(q && !groupMatches){
        items = items.filter(function(it){ return it.label.toLowerCase().indexOf(q)>-1; });
        if(!items.length) return "";
      }
      var hasData = g.items.some(function(it){ return wizard.materials[it.id]!==undefined && wizard.materials[it.id]!==""; });
      var open = q ? true : (wizard.materialsOpen[gi] || hasData);
      var groupTotal = g.items.reduce(function(s,it){ return s + (parseFloat(wizard.materials[it.id])||0); }, 0);
      var groupPhotoCount = g.items.filter(function(it){ return wizard.fotosMateriales[it.id]; }).length;
      var rows = items.map(function(it){
        var v = wizard.materials[it.id]!==undefined ? wizard.materials[it.id] : "";
        var photoUrl = wizard.fotosMateriales[it.id];
        return '<div style="display:flex; align-items:center; gap:8px; padding:7px 0">'+
          (photoUrl?
            '<div class="fslot filled" data-matphoto="'+it.id+'" style="width:30px;height:30px;flex:none"><img src="'+photoUrl+'" alt=""></div>'
            : '<button type="button" class="fraccam" data-matphoto="'+it.id+'" style="width:30px;height:30px;flex:none;border:1px solid var(--border);border-radius:8px" title="Foto de este material"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3l1.5-2h5L14 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13.5" r="3.4"/></svg></button>')+
          '<span style="flex:1; font-size:12.5px">'+it.label+'</span>'+
          '<input class="matinput" data-mat="'+it.id+'" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(v)+'" style="width:74px; text-align:right; font-family:inherit; font-size:13px; padding:7px 9px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--fg)">'+
          '<span style="font-size:11px; color:var(--fg-muted); width:16px">kg</span>'+
        '</div>';
      }).join("");
      return '<div class="card" style="padding:0; overflow:hidden">'+
        '<button type="button" class="matgroup-toggle" data-gi="'+gi+'" style="width:100%; display:flex; align-items:center; gap:10px; background:none; border:none; padding:13px 15px; cursor:pointer; font-family:inherit; text-align:left">'+
          (hasData? '<span style="width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none"></span>' : '')+
          '<span style="flex:1; font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">'+g.group+'</span>'+
          (groupPhotoCount? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--ok)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M3 7h3l1.5-2h5L14 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13.5" r="3.4"/></svg>' : '')+
          (groupTotal>0? '<span class="pill ok">'+round1(groupTotal)+' kg</span>' : '')+
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate('+(open?90:0)+'deg); transition:transform .15s; flex:none"><path d="M9 6l6 6-6 6"/></svg>'+
        '</button>'+
        (open? '<div style="padding:2px 15px 13px; border-top:1px solid var(--border)">'+rows+'</div>' : '')+
      '</div>';
    }).join("");

    return '<div class="banner">'+
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 10v10"/></svg>'+
        '<div>Categorías del protocolo oficial de caracterización de '+(wizard.tipo==="FORM"?"la fracción orgánica":"fracción resto y rechazos")+' de la ARC. Introduce el peso de cada material encontrado y toca el icono de cámara para fotografiarlo.</div>'+
      '</div>'+
      '<div style="position:relative">'+
        '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--fg-muted); pointer-events:none"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'+
        '<input id="matFilter" type="text" placeholder="Buscar material (p. ej. vidre, film, RAEE…)" value="'+esc(wizard.materialsFilter||"")+'" style="width:100%; font-family:inherit; font-size:13.5px; padding:11px 12px 11px 36px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--fg)">'+
      '</div>'+
      '<div class="card" style="position:sticky; top:calc(64px + env(safe-area-inset-top,0px)); z-index:3">'+
        '<div class="tolerance '+(target===0? "": (closeEnough?"ok":"warn"))+'" style="'+(target===0?"background:var(--surface-2); color:var(--fg-muted)":"")+'">'+
          '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+(closeEnough?'<path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/>':'<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>')+'</svg>'+
          '<span>Clasificado: <b>'+round1(total)+' kg</b>'+(target>0? ' de '+round1(target)+' kg de muestra ('+(diff>=0?"faltan ":"exceso de ")+round1(Math.abs(diff))+' kg)' : ' — introduce antes el peso de la muestra en el paso 2')+'</span>'+
        '</div>'+

  // Descarga usando la capability oficial "downloads" (funciona dentro del visor de
  // artefactos embebido en claude.ai). Si esa capability no está disponible — p.ej. cuando
  // el artefacto se abre como página propia, fuera del visor embebido, algo que puede pasar
  // en el navegador del móvil — no hay "host" al que pedir permiso, así que probamos el
  // método clásico de descarga (blob + enlace), que sí funciona fuera del visor.
  function downloadFileViaBlobLink(filename, data){
    try{
      var blob = (data instanceof Blob) ? data : new Blob([data], {type:"text/html"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return true;
    }catch(e){ return false; }
  }
  function downloadFile(filename, data, cb){
    function fallback(reason){
      if(downloadFileViaBlobLink(filename, data)){ cb({ok:true, via:"blob"}); }
      else { cb({ok:false, reason:reason}); }
    }
    if(!(window.claude && window.claude.use)){ fallback("unavailable"); return; }
    window.claude.use("downloads").then(function(downloads){
      if(!downloads){ fallback("unavailable"); return; }
      downloads.save({filename:filename, data:data}).then(function(res){
        cb({ok:true, status:res && res.status});
      }).catch(function(err){
        var code = (err && err.code) || "unavailable";
        if(code==="declined"){ cb({ok:false, reason:"declined"}); return; }
        fallback(code);
      });
    }).catch(function(){ fallback("unavailable"); });
  }

  /* ---------- diagrama de sectores (composición por fracción) ---------- */
  var CHART_SLOTS = ["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
  function donutChartHTML(entries, totalKg){
    if(!entries.length || totalKg<=0) return "";
    var MAX = 6;
    var slices = entries.slice(0, MAX);
    if(entries.length>MAX){
      var restKg = entries.slice(MAX).reduce(function(s,e){ return s+e.kg; },0);
      slices = slices.concat([{label:"Otros", kg:restKg, other:true}]);
    }
    var size=176, sw=28, r=(size-sw)/2, cx=size/2, cy=size/2, C=2*Math.PI*r;
    var offset=0, gap = slices.length>1?3:0;
    var arcs = slices.map(function(e,i){
      var frac = e.kg/totalKg;
      var len = frac*C;
      var dash = Math.max(len-gap,0);
      var color = e.other ? "var(--c-other)" : CHART_SLOTS[i];
      var seg = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'" '+
        'stroke-dasharray="'+dash+' '+(C-dash)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
      offset += len;
      return seg;
    }).join("");
    var svg = '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" role="img" aria-label="Composición por fracción">'+
      arcs+
      '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" font-size="20" font-weight="700" fill="var(--fg)" font-family="inherit">'+round1(totalKg)+'</text>'+
      '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" font-size="10.5" fill="var(--fg-muted)" font-family="inherit">kg clasificados</text>'+
    '</svg>';
    var legend = slices.map(function(e,i){
      var pct = round1(e.kg/totalKg*100);
      var color = e.other ? "var(--c-other)" : CHART_SLOTS[i];
      return '<div class="lrow"><span class="ldot" style="background:'+color+'"></span><span class="llabel">'+esc(e.label)+'</span><span class="lval">'+pct+'% · '+round1(e.kg)+' kg</span></div>';
    }).join("");
    return '<div style="display:flex; flex-direction:column; align-items:center; gap:14px">'+
      '<div style="flex:none">'+svg+'</div>'+
      '<div class="chart-legend" style="width:100%">'+legend+'</div>'+
    '</div>';
  }

  function wireStep(){
    var backBtn = document.getElementById("backBtn");
    if(backBtn) backBtn.addEventListener("click", function(){
      if(wizard.step===1){ goto("home"); return; }
      wizard.step--; render();
    });
    var nextBtn = document.getElementById("nextBtn");
    if(nextBtn) nextBtn.addEventListener("click", function(){ wizard.step++; render(); });

    if(wizard.step===1){
      main.querySelectorAll("[data-lote]").forEach(function(b){
        b.addEventListener("click", function(){
          wizard.lote = parseInt(b.dataset.lote,10);
          if(wizard.tipo){
            var t = TYPES.filter(function(x){return x.id===wizard.tipo})[0];
            if(!t || t.lote.indexOf(wizard.lote)===-1) wizard.tipo=null;
          }
          wizard.instalacion = null;
          render();
        });
      });
      main.querySelectorAll("[data-tipo]").forEach(function(b){
        b.addEventListener("click", function(){ wizard.tipo=b.dataset.tipo; render(); });
      });

      // vuelve a pintar, así que hay que actualizarlo aquí o se queda desactivado.
      if(fi) fi.addEventListener("change", function(){
        wizard.instalacion=fi.value;
        if(nextBtn) nextBtn.disabled = !(wizard.lote && wizard.tipo && wizard.instalacion);
      });

      if(fc) fc.addEventListener("input", function(){ wizard.circuito=fc.value; });

      });

      if(tecNuevo) tecNuevo.addEventListener("input", function(){ wizard.tecNuevo=tecNuevo.value; });

      if(tecAddBtn) tecAddBtn.addEventListener("click", function(){
        var name = (wizard.tecNuevo||(tecNuevo?tecNuevo.value:"")).trim();

        if(state.tecnicos.indexOf(name)>-1){ toast("Ese técnico/a ya existe"); return; }

        wizard.tecNuevo = "";

      });
      main.querySelectorAll("[data-tecdel]").forEach(function(b){
        b.addEventListener("click", function(){
          var name = b.dataset.tecdel;
          if(state.tecnicos.length<=1){ toast("Debe quedar al menos un técnico/a"); return; }
          state.tecnicos = state.tecnicos.filter(function(t){ return t!==name; });
          save();
          if(wizard.tecnico===name) wizard.tecnico = state.tecnicos[0];
          render();
        });
      });

      if(nextBtn) nextBtn.disabled = !(wizard.lote && wizard.tipo && wizard.instalacion);
      if(nextBtn) nextBtn.addEventListener("click", function(e){
        if(!(wizard.lote && wizard.tipo)){ e.stopImmediatePropagation(); toast("Selecciona lote y tipo de caracterización"); }
      });

        render();

        el.addEventListener("click", function(e){
          e.stopPropagation();
          var matId = el.dataset.matphoto;
          pickPhoto(function(dataUrl){
            wizard.fotosMateriales[matId] = dataUrl;
            render();
          });
        });
      });
    }

    if(wizard.step===4){
      main.querySelectorAll("[data-shotslot]").forEach(function(el){
        el.addEventListener("click", function(){
          var k = el.dataset.shotslot;
          pickPhoto(function(dataUrl){ wizard.photos[k] = dataUrl; render(); });

      var incAdd = document.getElementById("incAdd");
      if(incAdd) incAdd.addEventListener("click", function(){ wizard.incNueva = {texto:"", foto:null}; render(); });
      var incCancel = document.getElementById("incCancel");
      if(incCancel) incCancel.addEventListener("click", function(){ wizard.incNueva = null; render(); });

      if(incTexto) incTexto.addEventListener("input", function(){ wizard.incNueva.texto = incTexto.value; });
      var incFotoSlot = main.querySelector("[data-incfotoslot]");
      if(incFotoSlot) incFotoSlot.addEventListener("click", function(){
        pickPhoto(function(dataUrl){ wizard.incNueva.foto = dataUrl; render(); });
      });
      var incGuardar = document.getElementById("incGuardar");
      if(incGuardar) incGuardar.addEventListener("click", function(){
        var texto = (wizard.incNueva.texto||"").trim();
        if(!texto){ toast("Describe la incidencia antes de guardarla"); return; }
        wizard.incidencias.push({id:"inc"+Date.now(), texto:texto, foto:wizard.incNueva.foto});
        wizard.incNueva = null;
        render();
      });
      main.querySelectorAll("[data-incdel]").forEach(function(el){
        el.addEventListener("click", function(){
          var id = el.dataset.incdel;
          wizard.incidencias = wizard.incidencias.filter(function(i){ return i.id!==id; });
          render();
        });
      });
    }

    if(wizard.step===5){
      var geoBtn = document.getElementById("geoBtn");
      if(geoBtn) geoBtn.addEventListener("click", function(){
        geoBtn.textContent = "Localizando…";
        if(navigator.geolocation){
          navigator.geolocation.getCurrentPosition(function(pos){
            wizard.geo = pos.coords.latitude.toFixed(5)+", "+pos.coords.longitude.toFixed(5);
            render();
          }, function(){
            wizard.geo = "41.42367, 2.18868 (aprox.)";
            render();
          }, {timeout:4000});
        } else {
          wizard.geo = "41.42367, 2.18868 (aprox.)";
          render();
        }
      });
      var closeBtn = document.getElementById("closeBtn");
      if(closeBtn) closeBtn.addEventListener("click", function(){
        var rec = {
          id: "c"+Date.now(),
          tipo: wizard.tipo, lote: wizard.lote, instalacion: wizard.instalacion || "—",
          tecnico: wizard.tecnico, fecha: new Date().toISOString().slice(0,10),
          peso: wizard.peso ? parseFloat(wizard.peso) : null,
          estado: wizard.incidencias.length ? "incidencia" : "completo",
          circuito: wizard.circuito || "—",
          materials: Object.assign({}, wizard.materials),
          photos: Object.assign({}, wizard.photos),
          fotosMateriales: Object.assign({}, wizard.fotosMateriales),
          incidencias: wizard.incidencias.slice()
        };
        state.records.unshift(rec);
        markDirty(rec.id);
        save();
        toast("Registro guardado correctamente");
        goto("home");
      });
    }
  }

  /* ---------- instalación como app (PWA) ---------- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* sin conexión al publicar: se ignora */ });
    });
  }
  var deferredInstall = null;
  var installBtn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredInstall = e;
    if(installBtn) installBtn.style.display = "flex";
  });
  if(installBtn) installBtn.addEventListener("click", function(){
    if(!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.finally(function(){ deferredInstall = null; installBtn.style.display = "none"; });
  });
  window.addEventListener("appinstalled", function(){
    if(installBtn) installBtn.style.display = "none";
    toast("App instalada");
  });
  // iOS Safari no dispara beforeinstallprompt: en vez de un aviso flotante (que
  // en algunos navegadores empotrados no se podía cerrar), la instrucción se
  // añade como texto normal dentro de la tarjeta de inicio — ver installHintText().
  var IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  var IS_STANDALONE = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  function installHintText(){
    if(IS_STANDALONE) return "";
    if(IS_IOS) return "Para instalarla en iPhone/iPad: toca Compartir y luego «Añadir a pantalla de inicio».";
    return "Para instalarla, toca el icono de instalación arriba a la derecha (o el menú de tu navegador → «Instalar app» / «Añadir a pantalla de inicio»).";
  }

  render();
})();
</script>

</body></html>
