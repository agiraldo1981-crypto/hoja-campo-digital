# Supabase gratis pausa el proyecto tras 7 días sin actividad.
# Esto hace una consulta mínima dos veces por semana para que no se pause.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 7 * * 1,4"   # lunes y jueves a las 7:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://avwtygqwvuinzqfuvgab.supabase.co/rest/v1/registros?select=id&limit=1" \
            -H "apikey: sb_publishable_fsUVgUEpwO8dQdYN5ue8oA_jOLOQu7k")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
